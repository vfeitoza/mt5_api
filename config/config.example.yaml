# Copie para config.yaml e preencha SERVTEC_API_KEY (ou export env var)
bridge:
  host: "0.0.0.0"
  port: 5555

llm:
  base_url: "https://models.servtec.net.br/v1"
  api_key: ""  # ou export SERVTEC_API_KEY=sua_key
  model: "gemini-3.8-flash-high"
  fallbacks:
    - "deepseek-v4.1-flash"
    - "glm-5.3-flash"
    - "gpt-6-luna"
  timeout_s: 15.0
  max_tokens: 120
  temperature: 0.0

calendar:
  news_block_min: 30
  hours_ahead: 24
  use_ea_primary: true
  fallback_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"

loop_interval_s: 30.0
trigger_mode: "hybrid"  # hybrid | close_only | polling
# hybrid:    BOS só no candle fechado, reteste/MSS intra-candle (recomendado)
# close_only: tudo só quando fecha M5 (1 check/candle, sem repaint)
# polling:   legado, checa a cada loop_interval_s mesmo intra-candle
dry_run: false
log_level: "INFO"

strategies:
  smc_xau:
    enabled: false
    symbol: "XAUUSD"
    timeframe: "M5"
    magic: 102010
    volume: 0.05
    max_trades_day: 8
    max_losses_day: 3
    params:
      spread_max: 35
      bos_lookback: 20
      bos_expire: 15
      rr: 1.8
      sl_pad: 1.2

  scalp_m1:  # Scalp M1 XAUUSD — M1 micro ATR 1.2x RR1.5 + BE/trailing, magic 102012 próprio
    enabled: true
    symbol: "XAUUSD"
    timeframe: "M1"
    magic: 102012
    volume: 0.01
    max_trades_day: 10
    max_losses_day: 99
    params:
      lot_size: 0.01
      min_lot: 0.01
      max_lot: 10.0
      spread_max: 6
      rr: 1.5
      sl_pips: 0
      sl_atr_mult: 1.2
      atr_period: 14
      min_atr_pips: 8
      max_atr_pips: 25
      ema_fast: 9
      ema_slow: 21
      cci_period: 14
      use_cci: true
      cci_buy_level: -80
      cci_sell_level: 80
      use_m5_trend: true
      m5_ema_period: 20
      use_news: true
      news_before: 15
      news_after: 15
      news_include_moderate: false
      use_session: true
      session_start: 7
      session_end: 17
      min_score: 6
      show_score_log: true
      use_breakeven: true
      be_activation_mult: 0.8
      be_offset_pips: 3
      use_trailing: true
      trailing_mode: "atr"
      trailing_activation_mult: 1.0
      trailing_atr_mult: 1.0
      trailing_distance: 12
      trailing_step: 3
      use_partial: false
      partial_rr: 1.0
      partial_percent: 50

  scalp_himanshu:  # Himanshu2025 9-source XAU M1 scalper — M1 1min SGI full, LLM opcional, magic 102020
    enabled: true
    symbol: "XAUUSD"
    timeframe: "M1"
    magic: 102013
    volume: 0.01
    max_trades_day: 10
    max_losses_day: 99
    params:
      use_llm: false
      spread_max_usd: 0.30
      min_score: 5
      show_score_log: true
      ema_fast: 9
      ema_mid: 21
      ema_slow: 50
      ema_trend: 200
      rsi_period: 14
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      stoch_k: 14
      stoch_d: 3
      stoch_slowing: 3
      adx_period: 14
      adx_chop: 20
      atr_period: 14
      use_dxy: true
      dxy_symbol: "DXY"
      sl_min_usd: 1.00
      sl_max_usd: 3.00
      tp_ratios: [1, 2, 3]
      time_exit_min: 15
      news_before: 15
      news_after: 15
      lot_size: 0.01
      min_lot: 0.01
      max_lot: 10.0
      use_breakeven: true
      be_activation_mult: 1.0
      be_offset_pips: 3
      use_partial: true
      partial_rr: 1.0
      partial_percent: 33
      use_trailing: true
      trailing_mode: "atr"
      trailing_activation_mult: 2.0
      trailing_atr_mult: 1.5
      trailing_distance: 15
      trailing_step: 2

  scalping_huy_5pts:  # huynguyen03dev/xauusd-trading 5pts scalping — M5 structure first, LLM sempre, magic 102014
    enabled: true
    symbol: "XAUUSD"
    timeframe: "M5"
    magic: 102014
    volume: 0.03
    max_trades_day: 10
    max_losses_day: 99
    params:
      sl_points: 5
      tp1_points: 5
      tp2_points: 10
      atr_gate_m5: 8
      atr_gate_m15: 20
      spread_warn_usd: 0.35
      news_before: 15
      news_after: 15
      rollover_block: true
      rsi_period: 14
      stoch_k: 14
      adx_period: 14
      cci_period: 14
      ema_fast: 9
      ema_slow: 21
      lot_size: 0.03
      min_lot: 0.01
      max_lot: 10.0
      show_score_log: true
      use_llm: true
      use_breakeven: true
      be_activation_mult: 0.6
      be_offset_pips: 0
      use_partial: false
      use_trailing: true
      trailing_mode: "fixed"
      trailing_activation_mult: 1.0
      trailing_distance: 2
      trailing_step: 1
      time_exit_min: 0

  daytrade_fx:  # FX Daytrade M15 Killzone + London Breakout — EURUSD/USDJPY/GBPUSD (AUDUSD/EURJPY), payroll NFP NO_TRADE, LLM ativo
    enabled: true
    symbol: "EURUSD"
    timeframe: "M15"
    magic: 102015
    volume: 0.03
    max_trades_day: 10
    max_losses_day: 99
    params:
      symbols: ["EURUSD", "USDJPY", "GBPUSD"]
      use_llm: true
      spread_max_pips: 1.5
      adx_min: 18
      news_before: 20
      news_after: 20
      news_include_moderate: false
      show_score_log: true
      min_score: 6
      rr: 2.0  # RR do take final; parciais em 1.0R e 2.0R
      sl_atr_mult: 1.5
      ema_fast: 9
      ema_slow: 21
      use_breakeven: true
      be_activation_mult: 0.8
      be_offset_pips: 3
      use_partial: true
      partial1_rr: 1.0
      partial1_percent: 33
      partial2_rr: 2.0
      partial2_percent: 33
      partial_rr: 1.0
      partial_percent: 33
      use_trailing: true
      trailing_mode: "atr"
      trailing_activation_mult: 1.0
      trailing_atr_mult: 1.0
      trailing_distance: 12
      trailing_step: 3

  swing_fx:  # FX Swing H4 S/D + EMA 50/200 — EURUSD/USDJPY/GBPUSD/AUDUSD/EURJPY/USDCHF, payroll NFP NO_TRADE, LLM ativo
    enabled: true
    symbol: "EURUSD"
    timeframe: "H1"
    magic: 102016
    volume: 0.03
    max_trades_day: 4
    max_losses_day: 99
    params:
      symbols: ["EURUSD", "USDJPY", "GBPUSD"]
      use_llm: true
      spread_max_pips: 2.0
      news_before: 60
      news_after: 60
      news_include_moderate: true
      show_score_log: true
      min_score: 7
      rr: 2.8
      sl_atr_mult: 1.8
      ema_fast: 9
      ema_slow: 21
      cci_period: 14
      adx_period: 14
      use_breakeven: true
      be_activation_mult: 1.0
      be_offset_pips: 5
      use_trailing: true
      trailing_mode: "atr"
      trailing_activation_mult: 1.5
      trailing_atr_mult: 1.5
      trailing_distance: 30
      trailing_step: 5

  champion:  # NEW_CHAMPION 2.40 — fiel ao set xauusd_102001_m5.set (RR 1:4, min_score 12, news 20/20) magic 102011 próprio
    enabled: true
    symbol: "XAUUSD"
    timeframe: "M5"
    magic: 102011
    volume: 0.02  # lot_size fixo do set; 0 = auto (% risk)
    max_trades_day: 10
    max_losses_day: 99  # EA não usa max_losses; controle é via daily_loss
    params:
      # — risco —
      lot_size: 0.02
      risk_percent: 1.0
      min_lot: 0.01
      max_lot: 10.0
      sl_pips: 0              # 0 = ATR
      use_atr_sl: true
      atr_period: 14
      atr_mult: 2.0
      rr: 4.0
      spread_max: 5
      # — metas exclusivas champion —
      use_daily_target: true
      daily_profit_target: 100
      use_daily_loss: true
      daily_loss_limit: 50
      wait_after_loss: 30
      # — SMC —
      use_smc: true
      use_ob: true
      ob_lookback: 50
      ob_min_size: 1.5
      use_fvg: true
      fvg_lookback: 20
      fvg_min_size: 10
      use_bos: true
      bos_lookback: 30
      # — CCI —
      use_cci: true
      cci_period: 20
      use_dead_zone: true
      cci_dead_zone: 10
      require_extreme: true
      cci_extreme: 100
      cci_lookback: 5
      # — S/R —
      use_sr: true
      sr_lookback: 100
      sr_min_touches: 4
      sr_threshold: 20
      # — confluências —
      require_ob_sr_confluence: true
      require_mtf: true
      higher_tf: "H1"
      htf_ma_period: 50
      use_session: true
      session_use_gmt: true
      session_start: 7
      session_end: 17
      overlap_start: 12
      overlap_end: 16
      # — notícias —
      use_news_filter: true
      news_before: 20
      news_after: 20
      news_include_moderate: false
      # — score —
      use_score: true
      min_score: 12
      show_score_log: true
      # — gestão pós-entrada (PositionManager) —
      use_breakeven: true
      be_activation_mult: 1.0
      be_offset_pips: 5
      use_partial: false
      partial_rr: 1.0
      partial_percent: 50
      use_trailing: true
      trailing_mode: "atr"  # fixed | atr | structure
      trailing_activation_mult: 1.0
      trailing_atr_mult: 1.5
      trailing_distance: 30
      trailing_step: 5
