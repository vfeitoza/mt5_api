# Copie para config.yaml e preencha SERVTEC_API_KEY (ou export env var)
bridge:
  host: "0.0.0.0"
  port: 5555

llm:
  base_url: "https://models.servtec.net.br/v1"
  api_key: ""  # ou export SERVTEC_API_KEY=sua_key
  model: "gemini-3.8-flash-high"
  fallbacks:
    - "deepseek-v4.1-flash"
    - "glm-5.3-flash"
    - "gpt-6-luna"
  timeout_s: 15.0
  max_tokens: 120
  temperature: 0.0

calendar:
  news_block_min: 30
  hours_ahead: 24
  use_ea_primary: true
  fallback_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"

loop_interval_s: 30.0
trigger_mode: "hybrid"  # hybrid | close_only | polling
# hybrid:    BOS só no candle fechado, reteste/MSS intra-candle (recomendado)
# close_only: tudo só quando fecha M5 (1 check/candle, sem repaint)
# polling:   legado, checa a cada loop_interval_s mesmo intra-candle
dry_run: false
log_level: "INFO"

strategies:
  smc_xau:
    enabled: false
    symbol: "XAUUSD"
    timeframe: "M5"
    magic: 61001
    volume: 0.05
    max_trades_day: 8
    max_losses_day: 3
    params:
      spread_max: 35
      bos_lookback: 20
      bos_expire: 15
      rr: 1.8
      sl_pad: 1.2

  scalp_m1:  # Scalp M1 XAUUSD — M1 micro ATR 1.2x RR1.5 + BE/trailing, magic 102012 próprio
    enabled: true
    symbol: "XAUUSD"
    timeframe: "M1"
    magic: 102012
    volume: 0.01
    max_trades_day: 10
    max_losses_day: 99
    params:
      lot_size: 0.01
      min_lot: 0.01
      max_lot: 10.0
      spread_max: 6
      rr: 1.5
      sl_pips: 0
      sl_atr_mult: 1.2
      atr_period: 14
      min_atr_pips: 8
      max_atr_pips: 25
      ema_fast: 9
      ema_slow: 21
      cci_period: 14
      use_cci: true
      cci_buy_level: -80
      cci_sell_level: 80
      use_m5_trend: true
      m5_ema_period: 20
      use_news: true
      news_before: 15
      news_after: 15
      news_include_moderate: false
      use_session: true
      session_start: 7
      session_end: 17
      min_score: 6
      show_score_log: true
      use_breakeven: true
      be_activation_mult: 0.8
      be_offset_pips: 3
      use_trailing: true
      trailing_mode: "atr"
      trailing_activation_mult: 1.0
      trailing_atr_mult: 1.0
      trailing_distance: 12
      trailing_step: 3
      use_partial: false
      partial_rr: 1.0
      partial_percent: 50

  champion:  # NEW_CHAMPION 2.40 — fiel ao set xauusd_102001_m5.set (RR 1:4, min_score 12, news 20/20) magic 102011 próprio
    enabled: true
    symbol: "XAUUSD"
    timeframe: "M5"
    magic: 102011
    volume: 0.02  # lot_size fixo do set; 0 = auto (% risk)
    max_trades_day: 10
    max_losses_day: 99  # EA não usa max_losses; controle é via daily_loss
    params:
      # — risco —
      lot_size: 0.02
      risk_percent: 1.0
      min_lot: 0.01
      max_lot: 10.0
      sl_pips: 0              # 0 = ATR
      use_atr_sl: true
      atr_period: 14
      atr_mult: 2.0
      rr: 4.0
      spread_max: 5
      # — metas exclusivas champion —
      use_daily_target: true
      daily_profit_target: 100
      use_daily_loss: true
      daily_loss_limit: 50
      wait_after_loss: 30
      # — SMC —
      use_smc: true
      use_ob: true
      ob_lookback: 50
      ob_min_size: 1.5
      use_fvg: true
      fvg_lookback: 20
      fvg_min_size: 10
      use_bos: true
      bos_lookback: 30
      # — CCI —
      use_cci: true
      cci_period: 20
      use_dead_zone: true
      cci_dead_zone: 10
      require_extreme: true
      cci_extreme: 100
      cci_lookback: 5
      # — S/R —
      use_sr: true
      sr_lookback: 100
      sr_min_touches: 4
      sr_threshold: 20
      # — confluências —
      require_ob_sr_confluence: true
      require_mtf: true
      higher_tf: "H1"
      htf_ma_period: 50
      use_session: true
      session_use_gmt: true
      session_start: 7
      session_end: 17
      overlap_start: 12
      overlap_end: 16
      # — notícias —
      use_news_filter: true
      news_before: 20
      news_after: 20
      news_include_moderate: false
      # — score —
      use_score: true
      min_score: 12
      show_score_log: true
      # — gestão pós-entrada (PositionManager) —
      use_breakeven: true
      be_activation_mult: 1.0
      be_offset_pips: 5
      use_partial: false
      partial_rr: 1.0
      partial_percent: 50
      use_trailing: true
      trailing_mode: "atr"  # fixed | atr | structure
      trailing_activation_mult: 1.0
      trailing_atr_mult: 1.5
      trailing_distance: 30
      trailing_step: 5
